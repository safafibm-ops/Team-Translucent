    <meta name="theme-color" content="#f4f5f7" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // pick the theme before the first paint: saved choice, else the computer's setting
      (function () {
        var t = "light";
        try {
          t = localStorage.getItem("qi-theme");
          if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch (e) {
          t = "light";
        }
        document.documentElement.dataset.theme = t;
        if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0b0d10");
      })();
    </script>

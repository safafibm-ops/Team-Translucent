<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casting Inspection</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f4f6f9;color:#1a1a2e}
header{background:#1a1a2e;color:#fff;padding:16px 24px}header h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:#b8c0d0;font-size:14px}
main{max-width:1100px;margin:20px auto;padding:0 16px}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px #0002}
.row{display:flex;gap:16px;flex-wrap:wrap}.row>div{flex:1;min-width:260px}
img{max-width:100%;border-radius:8px}
.badge{display:inline-block;padding:6px 14px;border-radius:6px;color:#fff;font-weight:700;font-size:20px}
.PASS{background:#1b8a3a}.REVIEW{background:#c98a00}.REJECT{background:#c62828}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #eee;padding:6px;text-align:left}
button{background:#2f6fd6;color:#fff;border:0;padding:10px 18px;border-radius:6px;font-size:15px;cursor:pointer}
.muted{color:#666;font-size:13px}
</style></head><body>
<header><h1>Casting Quality Inspection</h1><p>FastAPI service · defect model + anomaly model · runs on CPU</p></header>
<main>
<div class="card"><b>Inspect parts</b><br><br>
<input type="file" id="files" accept="image/*" multiple> <button onclick="run()">Inspect</button>
<span id="status" class="muted"></span></div>
<div id="results"></div>
<div class="card"><b>Machine risk forecast</b> <span class="muted">(simulated machine readings)</span><div id="risk"></div></div>
<p class="muted">API docs: <a href="/docs">/docs</a></p>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function run(){
  const fs = document.getElementById("files").files; if(!fs.length) return;
  const st = document.getElementById("status");
  for (const f of fs){
    st.textContent = "Inspecting " + f.name + "...";
    const fd = new FormData(); fd.append("file", f);
    const r = await fetch("/inspect", {method:"POST", body:fd}); const d = await r.json();
    if(!r.ok){ st.textContent = d.detail || "Error"; continue; }
    const rows = d.defects.map(b => `<tr><td>${esc(b.defect)}</td><td>${esc(b.category)}</td><td>${b.confidence}</td><td>${esc(b.severity)}</td></tr>`).join("");
    const causes = d.root_cause ? d.root_cause.causes.map(c => `<li><b>${esc(c.factor.replace(/_/g," "))}</b> is ${c.direction}: ${c.value} ${esc(c.unit)} (normal ≈ ${c.normal})<br>→ ${esc(c.action)}</li>`).join("") : "";
    const div = document.createElement("div"); div.className = "card";
    div.innerHTML = `<div class="row">
      <div><img src="${d.boxed_image}"><div class="muted">${esc(d.part)}: defect model</div></div>
      <div>${d.heatmap ? `<img src="${d.heatmap}"><div class="muted">Anomaly heat-map, score ${d.anomaly_score}</div>` : `<div class="muted">Anomaly model skipped: defect model was sure.</div>`}</div>
      <div><span class="badge ${d.decision}">${d.decision}</span><p>${esc(d.reason)}</p>
      ${d.severity ? `<p><b>Severity:</b> ${esc(d.severity)}</p>` : ""}
      <p class="muted">CPU time: defect ${d.cpu_ms.defect} ms${d.cpu_ms.anomaly ? ", anomaly " + d.cpu_ms.anomaly + " ms" : ""}</p>
      ${rows ? `<table><tr><th>Defect</th><th>Type</th><th>Conf.</th><th>Severity</th></tr>${rows}</table>` : ""}
      ${d.root_cause ? `<p><b>Machine ${esc(d.machine)}, batch ${esc(d.batch)}</b> (simulated)<br>Likely cause, confidence ${Math.round(d.root_cause.confidence*100)}%:</p><ul>${causes || "<li>No single reading stands out.</li>"}</ul>` : ""}
      </div></div>`;
    document.getElementById("results").prepend(div);
  }
  st.textContent = "Done.";
}
fetch("/machines/risk").then(r => r.json()).then(rs => {
  document.getElementById("risk").innerHTML = `<table><tr><th>Machine</th><th>Predicted risk %</th><th>Recent defect %</th><th>Main defect</th><th>SPC alarm</th></tr>` +
    rs.map(m => `<tr><td>${m.machine}</td><td>${m["predicted_risk_%"]}</td><td>${m["defect_rate_recent_%"]}</td><td>${esc(m.main_defect)}</td><td>${m.spc_alarm ? "⚠ yes" : "no"}</td></tr>`).join("") + `</table>`;
});
</script></body></html>
